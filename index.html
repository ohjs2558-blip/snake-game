<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지렁이 게임 (Snake Game)</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        h1 {
            margin: 0 0 6px 0;
            font-size: 26px;
            letter-spacing: 1px;
            color: #4ade80;
        }
        .scoreboard {
            display: flex;
            gap: 24px;
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 18px;
            border-radius: 9999px;
            backdrop-filter: blur(4px);
        }
        .scoreboard span {
            color: #cbd5e1;
        }
        .scoreboard strong {
            color: #facc15;
            margin-left: 4px;
        }
        .game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
            background-color: #020617;
        }
        canvas {
            display: block;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .overlay h2 {
            font-size: 32px;
            margin: 0 0 10px 0;
            color: #f87171;
        }
        .overlay p {
            font-size: 16px;
            color: #94a3b8;
            margin: 0 0 20px 0;
        }
        .btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
        }
        .btn:hover {
            background: #16a34a;
            transform: scale(1.04);
        }
        .btn:active {
            transform: scale(0.96);
        }
        .controls-guide {
            margin-top: 14px;
            font-size: 13px;
            color: #64748b;
            text-align: center;
        }
        .key-badge {
            display: inline-block;
            background: #334155;
            color: #e2e8f0;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 12px;
            margin: 0 2px;
        }
        .mobile-controls {
            display: grid;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(2, 56px);
            gap: 8px;
            margin-top: 14px;
        }
        .m-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .m-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
        .m-up { grid-column: 2; grid-row: 1; }
        .m-left { grid-column: 1; grid-row: 2; }
        .m-down { grid-column: 2; grid-row: 2; }
        .m-right { grid-column: 3; grid-row: 2; }
    </style>
</head>
<body>

    <div class="header">
        <h1>지렁이 게임</h1>
        <div class="scoreboard">
            <div>현재 점수: <strong id="current-score">0</strong></div>
            <div>최고 점수: <strong id="high-score">0</strong></div>
        </div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div id="game-overlay" class="overlay">
            <h2 id="overlay-title">게임 오버</h2>
            <p id="overlay-desc">스페이스바 또는 아래 버튼을 눌러 다시 시작하세요.</p>
            <button id="start-btn" class="btn">다시 시작</button>
        </div>
    </div>

    <div class="controls-guide">
        이동: <span class="key-badge">W</span><span class="key-badge">A</span><span class="key-badge">S</span><span class="key-badge">D</span> 또는 <span class="key-badge">방향키</span> | 일시정지: <span class="key-badge">Space</span>
    </div>

    <!-- 모바일 / 터치 지원 컨트롤러 -->
    <div class="mobile-controls">
        <button class="m-btn m-up" id="btn-up">▲</button>
        <button class="m-btn m-left" id="btn-left">◀</button>
        <button class="m-btn m-down" id="btn-down">▼</button>
        <button class="m-btn m-right" id="btn-right">▶</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const currentScoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const startBtn = document.getElementById('start-btn');

        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE; // 20x20

        let snake = [];
        let dx = 0;
        let dy = 0;
        let nextDx = 0;
        let nextDy = 0;
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score') || 0;
        highScoreEl.textContent = highScore;

        let gameSpeed = 110;
        let gameLoopTimeout = null;
        let isRunning = false;
        let isPaused = false;

        function initGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            score = 0;
            currentScoreEl.textContent = score;
            spawnFood();
            isRunning = true;
            isPaused = false;
            overlay.classList.remove('active');
            clearTimeout(gameLoopTimeout);
            loop();
        }

        function spawnFood() {
            while (true) {
                food.x = Math.floor(Math.random() * TILE_COUNT);
                food.y = Math.floor(Math.random() * TILE_COUNT);
                const collision = snake.some(part => part.x === food.x && part.y === food.y);
                if (!collision) break;
            }
        }

        function update() {
            if (!isRunning || isPaused) return;

            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // 벽 충돌 감지
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                gameOver();
                return;
            }

            // 자기 자신 충돌 감지
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            // 사과(먹이) 먹었는지 체크
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                currentScoreEl.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snake_high_score', highScore);
                }
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function draw() {
            // 배경 지우기
            ctx.fillStyle = '#020617';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 격자무늬 은은하게 그리기
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1;
            for (let i = 0; i < TILE_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            // 먹이(빨간 사과 느낌) 그리기
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            const foodCenterX = food.x * GRID_SIZE + GRID_SIZE / 2;
            const foodCenterY = food.y * GRID_SIZE + GRID_SIZE / 2;
            ctx.arc(foodCenterX, foodCenterY, GRID_SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // 지렁이 그리기
            snake.forEach((part, index) => {
                if (index === 0) {
                    // 머리 (밝은 연두색)
                    ctx.fillStyle = '#4ade80';
                } else {
                    // 몸통 (녹색 그라데이션)
                    ctx.fillStyle = '#22c55e';
                }
                const padding = 1;
                ctx.beginPath();
                ctx.roundRect(
                    part.x * GRID_SIZE + padding,
                    part.y * GRID_SIZE + padding,
                    GRID_SIZE - padding * 2,
                    GRID_SIZE - padding * 2,
                    index === 0 ? 6 : 4
                );
                ctx.fill();

                // 머리 눈 표시
                if (index === 0) {
                    ctx.fillStyle = '#0f172a';
                    let eye1 = { x: 0, y: 0 };
                    let eye2 = { x: 0, y: 0 };

                    if (dx === 1) { // 오른쪽
                        eye1 = { x: 14, y: 5 }; eye2 = { x: 14, y: 15 };
                    } else if (dx === -1) { // 왼쪽
                        eye1 = { x: 6, y: 5 }; eye2 = { x: 6, y: 15 };
                    } else if (dy === -1) { // 위쪽
                        eye1 = { x: 5, y: 6 }; eye2 = { x: 15, y: 6 };
                    } else { // 아래쪽
                        eye1 = { x: 5, y: 14 }; eye2 = { x: 15, y: 14 };
                    }

                    ctx.beginPath();
                    ctx.arc(part.x * GRID_SIZE + eye1.x, part.y * GRID_SIZE + eye1.y, 2, 0, Math.PI * 2);
                    ctx.arc(part.x * GRID_SIZE + eye2.x, part.y * GRID_SIZE + eye2.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function loop() {
            update();
            draw();
            if (isRunning) {
                gameLoopTimeout = setTimeout(loop, gameSpeed);
            }
        }

        function gameOver() {
            isRunning = false;
            overlayTitle.textContent = '게임 오버';
            overlayDesc.textContent = `최종 점수: ${score}점`;
            startBtn.textContent = '다시 시작';
            overlay.classList.add('active');
        }

        function handleKey(e) {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy === 0) { nextDx = 0; nextDy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy === 0) { nextDx = 0; nextDy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx === 0) { nextDx = -1; nextDy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx === 0) { nextDx = 1; nextDy = 0; }
                    break;
                case ' ':
                    if (!isRunning) {
                        initGame();
                    } else {
                        isPaused = !isPaused;
                        if (isPaused) {
                            overlayTitle.textContent = '일시 정지';
                            overlayDesc.textContent = '스페이스바를 눌러 계속하세요.';
                            startBtn.textContent = '계속하기';
                            overlay.classList.add('active');
                        } else {
                            overlay.classList.remove('active');
                        }
                    }
                    break;
            }
        }

        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }
            handleKey(e);
        });

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                initGame();
            } else if (isPaused) {
                isPaused = false;
                overlay.classList.remove('active');
            }
        });

        // 모바일 버튼 핸들러
        document.getElementById('btn-up').onclick = () => { if (dy === 0) { nextDx = 0; nextDy = -1; } };
        document.getElementById('btn-down').onclick = () => { if (dy === 0) { nextDx = 0; nextDy = 1; } };
        document.getElementById('btn-left').onclick = () => { if (dx === 0) { nextDx = -1; nextDy = 0; } };
        document.getElementById('btn-right').onclick = () => { if (dx === 0) { nextDx = 1; nextDy = 0; } };

        // 최초 게임 시작
        initGame();
    </script>
</body>
</html>
